version: "3.3"

services:
  local-flex:
    image: ${PDK_TEST_FLEX_IMAGE_NAME:-mulesoft/flex-gateway}:${PDK_TEST_FLEX_IMAGE_VERSION:-1.13.0}
    ports:
      - ${PLAYGROUND_PORT:-8081}:8081
    volumes:
      - ./config:/usr/local/share/mulesoft/flex-gateway/conf.d/
  backend:
    image: python:3.12-alpine
    command: ["python", "-u", "/srv/server.py"]
    volumes:
      - ./mock-llm/server.py:/srv/server.py:ro
